services:
  vm-manager:
    build:
      context: ../..
      dockerfile: vm-manager/guacamole/vm-manager.Dockerfile
    restart: unless-stopped
    cap_drop:
      - ALL
    # create-learner-vm.sh assigns generated disks to the host libvirt-qemu
    # account, then tightens their modes. Keep the exception narrower than
    # running the container as fully privileged.
    cap_add:
      - CHOWN
      - FOWNER
    security_opt:
      - no-new-privileges:true
    environment:
      AIVIRTEACH_SESSION_TOKEN: "${AIVIRTEACH_SESSION_TOKEN:?Set AIVIRTEACH_SESSION_TOKEN}"
      AIVIRTEACH_GUACAMOLE_JSON_SECRET: "${GUACAMOLE_JSON_SECRET:?Set GUACAMOLE_JSON_SECRET}"
      AIVIRTEACH_RDP_ALLOWED_CIDRS: "${AIVIRTEACH_RDP_ALLOWED_CIDRS:-192.168.122.0/24}"
      AIVIRTEACH_BROWSER_SESSION_TTL: "${AIVIRTEACH_BROWSER_SESSION_TTL:-60}"
      AIVIRTEACH_API_TOKEN: "${AIVIRTEACH_API_TOKEN:?Set AIVIRTEACH_API_TOKEN}"
    ports:
      - "127.0.0.1:8760:8760"
    volumes:
      # virsh/virt-install talk to the host qemu:///system daemon. The host
      # identity files let chown resolve the same libvirt-qemu/kvm/libvirt IDs.
      - /etc/passwd:/etc/passwd:ro
      - /etc/group:/etc/group:ro
      - /var/run/libvirt/libvirt-sock:/var/run/libvirt/libvirt-sock
      # Keep identical absolute paths: host libvirtd receives these paths from
      # virt-install and must be able to open the generated overlay/seed files.
      - /var/lib/libvirt/images/aivirteach:/var/lib/libvirt/images/aivirteach:rw
      - /var/lib/aivirteach-labs:/var/lib/aivirteach-labs:rw

  guacd:
    image: "guacamole/guacd:${GUACAMOLE_VERSION:-1.6.0}"
    restart: unless-stopped
    networks:
      - guacamole

  guacamole:
    image: "guacamole/guacamole:${GUACAMOLE_VERSION:-1.6.0}"
    restart: unless-stopped
    depends_on:
      - guacd
    environment:
      GUACD_HOSTNAME: guacd
      GUACD_PORT: "4822"
      JSON_ENABLED: "true"
      JSON_SECRET_KEY: "${GUACAMOLE_JSON_SECRET:?Set GUACAMOLE_JSON_SECRET}"
      REMOTE_IP_VALVE_ENABLED: "true"
      API_SESSION_TIMEOUT: "30"
    ports:
      - "127.0.0.1:8080:8080"
    networks:
      - guacamole

networks:
  guacamole:
