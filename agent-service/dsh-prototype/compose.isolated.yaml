name: dsh-test
x-agent: &agent
  image: dsh-test-agent:${DSH_TEST_IMAGE_TAG:-stage2}
  user: "1000:1000"
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  init: true
  cpus: 1.0
  cpu_shares: 128
  mem_limit: 2g
  memswap_limit: 2g
  pids_limit: 192
  restart: "no"
  tmpfs: ["/tmp:size=64m,mode=1777"]
  networks: [isolated]
  logging:
    driver: json-file
    options: {max-size: "5m", max-file: "2"}
services:
  initialize:
    <<: *agent
    profiles: [setup]
    command: [python, -m, dsh_tutor.isolated_host, initialize]
    volumes:
      - ./.isolated/state:/state
      - ./.isolated/config:/run/config:ro
  fake-provider:
    <<: *agent
    command: [python, -m, sandbox.isolated_provider]
    cpus: 0.25
    mem_limit: 128m
    memswap_limit: 128m
    pids_limit: 32
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:18080/health',timeout=2).read(2048)"]
      interval: 10s
      timeout: 3s
      retries: 3
  agent:
    <<: *agent
    environment:
      TMPDIR: /native-cache
    tmpfs:
      - "/tmp:size=64m,mode=1777,noexec,nosuid,nodev"
      - "/native-cache:size=64m,mode=0700,uid=1000,gid=1000,exec,nosuid,nodev"
    depends_on:
      fake-provider: {condition: service_healthy}
    volumes:
      - ./.isolated/state:/state
      - ./.isolated/config:/run/config:ro
      - ./.isolated/secrets/management_token:/run/secrets/management_token:ro
    stop_grace_period: 30s
    healthcheck:
      test: [CMD, python, /app/tools/isolated_health.py]
      interval: 10s
      timeout: 3s
      retries: 3
  management:
    image: dsh-test-management:${DSH_TEST_IMAGE_TAG:-stage2}
    user: "1000:1000"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    init: true
    cpus: 0.5
    cpu_shares: 128
    mem_limit: 512m
    memswap_limit: 512m
    pids_limit: 64
    restart: "no"
    tmpfs: ["/tmp:size=32m,mode=1777"]
    networks: [isolated]
    volumes:
      - ./.isolated/secrets/management_token:/run/secrets/management_token:ro
    depends_on:
      agent: {condition: service_healthy}
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:13002').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 3s
      retries: 3
    logging:
      driver: json-file
      options: {max-size: "5m", max-file: "2"}
  access:
    image: dsh-test-access:${DSH_TEST_IMAGE_TAG:-stage2}
    user: "1000:1000"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    init: true
    cpus: 0.25
    cpu_shares: 128
    mem_limit: 128m
    memswap_limit: 128m
    pids_limit: 32
    restart: "no"
    tmpfs: ["/tmp:size=32m,mode=1777"]
    networks: [isolated, access]
    ports:
      - "127.0.0.1:18792:18792"
      - "127.0.0.1:13002:13002"
    depends_on:
      agent: {condition: service_healthy}
      management: {condition: service_healthy}
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, "http://127.0.0.1:18792/health"]
      interval: 10s
      timeout: 3s
      retries: 3
    logging:
      driver: json-file
      options: {max-size: "1m", max-file: "2"}
networks:
  isolated:
    internal: true
  access: {}
