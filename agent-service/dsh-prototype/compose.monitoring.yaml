# 监控和告警。叠加在 compose.platform.yaml 上，与 DSH Agent 同一个 compose 项目运行：
#   docker compose -f compose.platform.yaml -f compose.monitoring.yaml \
#     --env-file ../../config.env --env-file .env.monitoring up -d --build
# 变量见 deploy/monitoring.env.example，部署和检查步骤见 docs/monitoring.md。
#   Agent ──trace──> otel-collector ──trace──> phoenix（查看每次请求）
#                         └──指标──> prometheus（告警规则）──> alertmanager（通知）
# 三个界面（Phoenix 6006、Prometheus 9090、Alertmanager 9093）只发布在服务器本机 127.0.0.1，经 SSH 隧道访问；
# Collector 不发布任何端口。
x-hardening: &hardening
  restart: unless-stopped
  init: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  read_only: true

services:
  phoenix:
    # 20.16.0 已在本地验证；升级前先在测试环境重新验证。digest 是多架构索引（amd64、arm64）。
    image: arizephoenix/phoenix:version-20.16.0-nonroot@sha256:e4a41a209b07289581a5d48167a11051c12704ac48983056fe0989b6f13b467a
    <<: *hardening
    user: "65532:65532"
    tmpfs:
      - "/tmp:size=64m,mode=1777,noexec,nosuid,nodev"
    pids_limit: 256
    mem_limit: ${PHOENIX_MEM_LIMIT:-1g}
    memswap_limit: ${PHOENIX_MEM_LIMIT:-1g}
    environment:
      # 数据（SQLite）放在命名卷里；卷挂在镜像自带、属于 nonroot 用户的 /home/nonroot，首次创建时继承它的权限。
      PHOENIX_WORKING_DIR: /home/nonroot/.phoenix
      PHOENIX_PORT: "6006"
      # 登录：界面、REST、OTLP 接收都要求登录或 API key。管理员账号为 admin@localhost。
      PHOENIX_ENABLE_AUTH: "true"
      PHOENIX_SECRET: "${PHOENIX_SECRET:?Set PHOENIX_SECRET in .env.monitoring}"
      PHOENIX_DEFAULT_ADMIN_INITIAL_PASSWORD: "${PHOENIX_ADMIN_INITIAL_PASSWORD:?Set PHOENIX_ADMIN_INITIAL_PASSWORD in .env.monitoring}"
      PHOENIX_ENABLE_STRONG_PASSWORD_POLICY: "true"
      PHOENIX_USE_SECURE_COOKIES: "false"  # 经 SSH 隧道用 http://localhost 访问；改为 HTTPS 访问时设为 true
      # 保留期：超过天数的 trace 每周日 0 点清理（所以最长约多保留 7 天）；磁盘用量到 90% 停止写入。
      PHOENIX_DEFAULT_RETENTION_POLICY_DAYS: "${PHOENIX_RETENTION_DAYS:-30}"
      PHOENIX_DATABASE_ALLOCATED_STORAGE_CAPACITY_GIBIBYTES: "${PHOENIX_STORAGE_GIB:-10}"
      PHOENIX_DATABASE_USAGE_INSERTION_BLOCKING_THRESHOLD_PERCENTAGE: "90"
      # 关闭 Phoenix 的统计像素、外部字体，以及用不到的 AI 助手（含服务器端 Shell）、MCP 接口和代码沙箱。
      PHOENIX_TELEMETRY_ENABLED: "false"
      PHOENIX_ALLOW_EXTERNAL_RESOURCES: "false"
      PHOENIX_DISABLE_AGENT_ASSISTANT: "true"
      PHOENIX_AGENTS_DISABLE_BASH: "true"
      PHOENIX_AGENTS_DISABLE_WEB_ACCESS: "true"
      PHOENIX_AGENTS_DISABLE_GITHUB: "true"
      PHOENIX_ENABLE_MCP_SERVER: "false"
      PHOENIX_ALLOWED_SANDBOX_PROVIDERS: "NONE"
    ports:
      # 只发布界面/HTTP 接收端口，且只在本机；gRPC 4317 不发布，Agent 走容器网络的 HTTP。
      - "127.0.0.1:${PHOENIX_UI_PORT:-6006}:6006"
    volumes:
      - "phoenix-data:/home/nonroot"
    healthcheck:
      test: ["CMD", "/usr/bin/python3.13", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:6006/healthz', timeout=3).read()"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.163.2@sha256:7f22d2a6748110ffb6a59bc0df448bccbf501cdb667d610ede4c61d3863d5849
    <<: *hardening
    user: "10001:10001"
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    pids_limit: 128
    mem_limit: ${OTELCOL_MEM_LIMIT:-512m}
    memswap_limit: ${OTELCOL_MEM_LIMIT:-512m}
    environment:
      # 首次部署时还没有 API key：先留空（Phoenix 拒收，PhoenixExportFailing 告警），在 Phoenix 里创建后填入再重启 Collector。
      PHOENIX_API_KEY: "${PHOENIX_API_KEY:-}"
    volumes:
      - "./deploy/otel-collector.yaml:/etc/otelcol-contrib/config.yaml:ro"

  prometheus:
    image: prom/prometheus:v3.15.1@sha256:fa3302279710be2f21a8301ec17a8b4f2301fd829bd113839b3b6b02b6f191a2
    <<: *hardening
    user: "65534:65534"
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-15d}"
      - "--storage.tsdb.retention.size=${PROMETHEUS_RETENTION_SIZE:-2GB}"
      # 新出现的计数器从 0 开始算，第一次失败也能触发告警（配合 prometheus.yml 的 scrape_protocols）。
      - "--enable-feature=created-timestamp-zero-ingestion"
      - "--web.listen-address=:9090"
    pids_limit: 128
    mem_limit: ${PROMETHEUS_MEM_LIMIT:-512m}
    memswap_limit: ${PROMETHEUS_MEM_LIMIT:-512m}
    ports:
      - "127.0.0.1:${PROMETHEUS_UI_PORT:-9090}:9090"
    volumes:
      - "./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro"
      - "./deploy/alerts.yml:/etc/prometheus/alerts.yml:ro"
      - "prometheus-data:/prometheus"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9090/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 3

  alertmanager:
    image: prom/alertmanager:v0.34.1@sha256:e9733bafb1bdef9b00e25a21f8f99dc26a22224bf16641ad754d1649f4c3357a
    <<: *hardening
    user: "65534:65534"
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
      - "--storage.path=/alertmanager"
      - "--web.listen-address=:9093"
      # 单机运行：关闭集群端口 9094（默认会监听所有网卡）。
      - "--cluster.listen-address="
    pids_limit: 128
    mem_limit: ${ALERTMANAGER_MEM_LIMIT:-256m}
    memswap_limit: ${ALERTMANAGER_MEM_LIMIT:-256m}
    ports:
      - "127.0.0.1:${ALERTMANAGER_UI_PORT:-9093}:9093"
    volumes:
      # 默认配置没有通知渠道；要发邮件或企业微信见 deploy/alertmanager.example.yml。
      - "${ALERTMANAGER_CONFIG:-./deploy/alertmanager.yml}:/etc/alertmanager/alertmanager.yml:ro"
      - "alertmanager-data:/alertmanager"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9093/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 3

  dsh-agent:
    environment:
      # Agent 只发给 Collector（容器网络内，不需要密钥）；Phoenix 的 API key 只在 Collector 里。
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4318"
      OTEL_EXPORTER_OTLP_HEADERS: ""

volumes:
  phoenix-data:
  prometheus-data:
  alertmanager-data:
