# 仅本测试项目的固定转发；不接入宿主Nginx、不接受客户端指定上游地址。
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 64; }
http {
    access_log off;
    client_max_body_size 32k;
    client_header_timeout 3s;
    client_body_timeout 3s;
    send_timeout 5s;
    keepalive_timeout 5s;
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    proxy_connect_timeout 2s;
    proxy_read_timeout 8s;
    proxy_send_timeout 5s;
    proxy_http_version 1.1;
    proxy_set_header Connection close;
    map $http_host $api_host_allowed {
        default 0;
        "127.0.0.1:18792" 1;
        "localhost:18792" 1;
    }
    map $http_host $management_host_allowed {
        default 0;
        "127.0.0.1:13002" 1;
        "localhost:13002" 1;
    }
    server {
        listen 18792;
        if ($api_host_allowed = 0) { return 403; }
        location / {
            proxy_set_header Host "127.0.0.1:18792";
            proxy_pass http://agent:18792;
        }
    }
    server {
        listen 13002;
        if ($management_host_allowed = 0) { return 403; }
        location / {
            proxy_set_header Host $http_host;
            proxy_pass http://management:13002;
        }
    }
}
